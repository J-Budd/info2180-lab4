<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Avengers Character Search</title>
    <link rel="stylesheet" href="styles.css"/>
    <script src="app.js"></script>
</head>
<body>
    <div class="container">
        <div id="box1" class="grid-item">
            <header>
            <h1>Avengers Character Search</h1>
            </header>
        </div>
        <div id="box2" class="grid-item">
            <h2>Search by Full Name or Alias</h2>
            <div class="form-field">
                <label for="heroname"><in>e.g. Captain America or Steve Rogers</in></label>
                <input type="text" id="heroname">
            </div>
            <div class="controls">
                <button type="button" class="btn">Search</button>
            </div>
        </div> 
        <div id="box3">
            <h2>Results</h2>
            <div id="results">

            </div>
        </div>
    </div>
    <script>
        document.querySelector("button").addEventListener("click", function() {
            const heroname = document.getElementById("heroname").value.trim();
            console.log(heroname);
            const httpRequest = new XMLHttpRequest();
            const url = `http://localhost/info2180-lab4/superheroes.php?query=${encodeURIComponent(heroname)}`;

            httpRequest.onreadystatechange = function() {
                if (httpRequest.readyState === XMLHttpRequest.DONE) {
                    if (httpRequest.status === 200) {
                        document.getElementById("results").innerHTML = httpRequest.responseText;
                    } else {
                        document.getElementById("results").innerHTML = "<p>There was a problem with the request</p>";
                    }
                }
            };
            httpRequest.open('GET', url, true);
            httpRequest.send();
        });
    </script>
</body>
</html>
